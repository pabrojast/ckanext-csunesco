csunesco-css:
  output: css/csunesco.css
  contents:
    - css/csunesco.css

csunesco-js:
  filters: rjsmin
  output: js/csunesco.js
  extra:
    preload:
      - base/main
  contents:
    - js/csunesco.js

# Standalone project-region map behaviour. No base/main preload: it depends only
# on Leaflet (loaded via CDN in the landing template) and vanilla DOM APIs.
cs-map-js:
  filters: rjsmin
  output: js/cs-map.js
  contents:
    - js/cs-map.js

# Observation maps for connected app-data sources on the project landing. Same
# footprint as cs-map-js: Leaflet from CDN + vanilla DOM, no preload.
cs-data-map-js:
  filters: rjsmin
  output: js/cs-data-map.js
  contents:
    - js/cs-data-map.js

# Chart.js 4.5.1, VENDORED rather than pulled from a CDN: a public UNESCO page
# should make no third-party request, and the portal must keep working without
# outbound internet access. No rjsmin filter -- the file is already minified and
# re-minifying a 208 KB bundle only burns build time.
chartjs:
  output: js/chart.umd.min.js
  contents:
    - vendor/chart.umd.min.js

# Chart blocks on a project page. Depends on Chart.js being loaded first (the
# template emits the chartjs bundle before this one) and on nothing else.
cs-charts-js:
  filters: rjsmin
  output: js/cs-charts.js
  contents:
    - js/cs-charts.js

# The "ask the data" block. Loaded after cs-charts-js (it reuses that bundle's
# chart painter, published on window) and only on pages that carry the block.
cs-data-chat-js:
  filters: rjsmin
  output: js/cs-data-chat.js
  contents:
    - js/cs-data-chat.js

# The project-page editor: rich-text toolbar, reorder, chart field picker.
# Preloads csunesco-js so it can reuse its shared helpers.
cs-page-editor-js:
  filters: rjsmin
  output: js/cs-page-editor.js
  extra:
    preload:
      - csunesco/csunesco-js
  contents:
    - js/cs-page-editor.js

# Public project-page behaviour (the gallery lightbox). Loaded only by pages
# that actually have one; the gallery works without it.
cs-page-view-js:
  filters: rjsmin
  output: js/cs-page-view.js
  contents:
    - js/cs-page-view.js
