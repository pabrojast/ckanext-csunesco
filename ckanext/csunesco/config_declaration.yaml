version: 1
groups:
  - annotation: Citizen Science media uploads
    options:
      - key: ckan.upload.csunesco.types
        type: list
        default: image application
        description: Broad MIME families accepted by Citizen Science image and news-attachment editors.
      - key: ckan.upload.csunesco.mimetypes
        type: list
        default: image/jpeg image/png image/webp application/pdf application/msword application/vnd.openxmlformats-officedocument.wordprocessingml.document application/zip application/x-ole-storage application/octet-stream
        description: Exact image and PDF, DOC or DOCX MIME types accepted by Citizen Science editors; file signatures are checked separately before storage.
      - key: ckanext.csunesco.max_attachment_size
        type: int
        default: 20
        description: Maximum size in MiB for a news PDF, DOC or DOCX attachment.
  - annotation: CS Toolbox project portal
    options:
      - key: ckanext.csunesco.portal_service_user
        type: base
        default: ''
        description: CKAN service account allowed to submit project projections. It cannot be the author.
      - key: ckanext.csunesco.portal_storage_path
        type: base
        default: ''
        description: Persistent private publication directory; falls back to ckan.storage_path.
      - key: ckanext.csunesco.portal_preview_origin
        type: base
        default: ''
        description: Exact CS Toolbox web origin allowed to embed private read-only previews.
      - key: ckanext.csunesco.ofform_callback_token
        type: base
        default: ''
        description: Server-only credential for project intake, review callbacks and observation snapshots.
      - key: ckanext.csunesco.portal_sync_enabled
        type: bool
        default: false
        description: Repair approved snapshots and callbacks every 300 seconds using shared persistent storage.
