{# Editor: a map of one data source's observations. Vars: block, index, project. #}
{% snippet "csunesco/blocks/edit/_data_source_select.html", block=block,
           index=index, project=project, field_id='b%s-obs-source' % index %}
<div class="cs-field cs-pb-pair">
  <span>
    <label for="b{{ index }}-obs-caption">{{ _("Caption") }}</label>
    <input type="text" id="b{{ index }}-obs-caption" name="blocks[{{ index }}][caption]"
           value="{{ block.caption }}">
  </span>
  <span>
    <label for="b{{ index }}-obs-height">{{ _("Height (pixels)") }}</label>
    <input type="number" id="b{{ index }}-obs-height" name="blocks[{{ index }}][height]"
           value="{{ block.height }}" min="240" max="700" step="20">
  </span>
</div>
