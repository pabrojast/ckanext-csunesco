<section class="cs-hero cs-project-hero" id="block-{{ block.id }}"
         aria-labelledby="title-{{ block.id }}"
         {%- if block.image_url %} style="--cs-project-hero-img: url('{{ block.image_url }}'); --cs-hero-x: {{ block.focal_x or 50 }}%; --cs-hero-y: {{ block.focal_y or 50 }}%"{% endif %}>
  <p class="cs-project-hero-initiative">{{ _("Citizen Science initiative") }}</p>
  <h1 id="title-{{ block.id }}">{{ block.heading or ctx.initiative.title }}</h1>
  <p>{{ block.tagline or _("Community projects contributing to the %(name)s initiative.", name=ctx.initiative.title) }}</p>
</section>
