{#
  Block: rich text.

  `html` was sanitized with sanitize_page_html BEFORE storage, which is what
  makes `| safe` legitimate here.

  Vars: block, ctx.
#}
{% if block.html %}
  <section class="cs-section cs-block cs-block-text{% if block.width == 'narrow' %} cs-block-narrow{% endif %}"
           id="block-{{ block.id }}"
           aria-labelledby="title-{{ block.id }}">
    {% snippet "csunesco/blocks/_heading.html", block=block %}
    <div class="cs-rich-text">{{ block.html | safe }}</div>
  </section>
{% endif %}
