<!DOCTYPE html>
<html lang="{{ lang }}" dir="{{ direction }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ subject }}</title>
  <style>
    body { margin:0; padding:0; background:#DDE9EC; }
    @media only screen and (max-width:600px) {
      .container { width:100% !important; }
      .px { padding-left:20px !important; padding-right:20px !important; }
      .h1 { font-size:22px !important; }
    }
  </style>
</head>
<body dir="{{ direction }}" style="margin:0;padding:0;background:#DDE9EC;font-family:'Inter',Arial,Helvetica,sans-serif;text-align:{{ align }};">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;">{{ subject }}{% for i in range(40) %}&zwnj;&nbsp;{% endfor %}</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#DDE9EC;">
    <tr><td align="center" style="padding:32px 12px;text-align:center;">
      <table role="presentation" dir="{{ direction }}" class="container" width="600" align="center" cellpadding="0" cellspacing="0" style="width:100%;max-width:600px;table-layout:fixed;margin:0 auto;background:#FFFFFF;border-radius:20px;overflow:hidden;box-shadow:0 20px 40px -20px rgba(8,63,88,.25);text-align:{{ align }};">
        <tr><td style="background:#183254;background:linear-gradient(135deg,#183254,#0F2138);padding:28px 32px;">
          <table role="presentation" dir="{{ direction }}" cellpadding="0" cellspacing="0"><tr>
            <td valign="middle" width="34"><img src="{{ logo_url }}" width="30" height="30" alt="UNESCO" style="display:block;border:0;border-radius:6px;"></td>
            <td valign="middle" style="{% if direction == 'rtl' %}padding-right{% else %}padding-left{% endif %}:10px;">
              <div style="font-family:Arial,Helvetica,sans-serif;font-size:10px;letter-spacing:1.5px;font-weight:700;color:#B8C4D1;line-height:1;">UNESCO</div>
              <div style="font-family:'Space Grotesk',Arial,Helvetica,sans-serif;font-size:15px;font-weight:700;color:#FFFFFF;line-height:1.3;margin-top:2px;">{{ brand_name }}</div>
            </td>
          </tr></table>
        </td></tr>
        <tr><td style="height:4px;line-height:4px;font-size:0;background:#2FA89E;">&nbsp;</td></tr>
        <tr><td class="px" align="{{ align }}" style="padding:40px;overflow-wrap:anywhere;word-wrap:break-word;">
          <h1 class="h1" style="margin:0 0 18px;font-family:'Space Grotesk',Arial,Helvetica,sans-serif;font-size:28px;line-height:1.25;color:#14303D;">{{ subject }}</h1>
          {% for paragraph in paragraphs %}
          <p style="margin:0 0 16px;font-family:'Inter',Arial,Helvetica,sans-serif;font-size:15px;line-height:1.6;color:#5C7A85;text-align:inherit;">{{ paragraph }}</p>
          {% endfor %}
          {% if cta_url %}
          <table role="presentation" cellpadding="0" cellspacing="0" style="margin-top:24px;"><tr>
            <td align="center" style="border-radius:12px;background:#183254;padding:14px 28px;">
              <a href="{{ cta_url }}" target="_blank" style="display:inline-block;font-family:'Inter',Arial,Helvetica,sans-serif;font-size:15px;font-weight:700;color:#FFFFFF;text-decoration:none;">{{ cta_label }}</a>
            </td>
          </tr></table>
          {% endif %}
        </td></tr>
        <tr><td class="px" style="padding:28px 40px 32px;background:#F7FBFC;overflow-wrap:anywhere;word-wrap:break-word;">
          <p style="margin:0 0 10px;font-family:'Inter',Arial,Helvetica,sans-serif;font-size:12.5px;line-height:1.6;color:#5C7A85;">{{ support_label }} <a href="mailto:{{ support_email }}" style="color:#183254;text-decoration:none;font-weight:600;">{{ support_email }}</a></p>
          <p style="margin:0;font-family:'Inter',Arial,Helvetica,sans-serif;font-size:11.5px;line-height:1.6;color:#9AAEB5;">UNESCO Citizen Science Toolbox · {{ footer_note }}</p>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
