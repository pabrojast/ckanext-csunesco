  {% if portal_readonly_preview and preview_parent_origin %}
  <script>
    window.addEventListener('message', function (event) {
      if (event.origin === {{ preview_parent_origin | tojson }} && event.source === window.parent &&
          event.data && event.data.type === 'cs-portal-preview-check' && event.data.path === window.location.pathname) {
        window.parent.postMessage({type: 'cs-portal-preview-ready', requestId: event.data.requestId}, event.origin);
      }
    });
  </script>
  {% endif %}
